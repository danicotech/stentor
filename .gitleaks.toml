# gitleaks 設定:沿用預設規則,只放行測試用的假憑證。
#
# 為什麼要有這個檔:誤報會淹沒真報。上 GitHub 前的掃描如果每次都有已知的
# 測試固定值,人就會開始略過整份輸出——那時真的洩漏也會一起被略過。
#
# 放行原則(不要放寬):只放行**測試檔**裡的**明顯合成值**,用完整字串精準比對,
# 不用寬鬆的路徑或規則排除。正式程式碼一律不放行;憑證只從環境變數注入。
[extend]
useDefault = true

# Discord snowflake 的假值。規則把任何 17–20 位數字當成 client id,
# 而測試需要形狀正確的 snowflake 才測得到設定解析與 X-Acting-User 的組裝。
[[rules]]
id = "discord-client-id"
[rules.allowlist]
regexes = [
  '''123456789012345678''',
  '''100000000000000001''',
  '''999999999999999999''',
]
paths = [
  '''tests/.*\.ts$''',
]
regexTarget = "match"
